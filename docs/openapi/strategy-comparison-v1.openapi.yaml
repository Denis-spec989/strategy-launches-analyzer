openapi: 3.1.0
info:
  title: Strategy Launches Analyzer API
  version: 1.1.0
servers:
- url: /
paths:
  /api/v1/strategies/compare:
    post:
      tags:
      - Strategy comparison
      summary: Compare main and shadow strategy launches
      operationId: compare
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareStrategyRequest"
        required: true
      responses:
        "200":
          description: Deterministic comparison completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompareStrategyResponse"
        "400":
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/strategies/compare/batch:
    post:
      tags:
      - Strategy comparison
      summary: Compare up to 1000 main and shadow strategy launch pairs
      description: "Each non-empty UTF-8 NDJSON line must conform to CompareStrategyRequest.\
        \ The ZIP response contains manifest.json, report.xlsx, and results.ndjson."
      operationId: compareBatch
      requestBody:
        content:
          application/x-ndjson:
            schema:
              type: string
              description: "CompareStrategyRequest objects, one per line"
        required: true
      responses:
        "200":
          description: Batch comparison archive created. Item failures are contained
            in the archive.
          headers:
            X-Batch-Id:
              description: Server-generated batch UUID
              style: simple
              schema:
                type: string
                format: uuid
            Content-Disposition:
              description: Attachment filename strategy-comparison-<batchId>.zip
              style: simple
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          description: Batch is empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Batch size limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Another batch is active on this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Batch processing timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "507":
          description: Insufficient temporary storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    CompareStrategyRequest:
      type: object
      properties:
        strategy:
          type: string
          enum:
          - LGD_DIGITAL
        mainLaunch:
          $ref: "#/components/schemas/JsonNode"
        shadowLaunch:
          $ref: "#/components/schemas/JsonNode"
        metadata:
          $ref: "#/components/schemas/LaunchMetadata"
      required:
      - mainLaunch
      - metadata
      - shadowLaunch
      - strategy
    JsonNode: {}
    LaunchMetadata:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        mainLaunchId:
          type: string
        shadowLaunchId:
          type: string
        mainStrategyVersion:
          type: string
          description: Version of the main strategy used for the launch
          minLength: 1
        shadowStrategyVersion:
          type: string
          description: Version of the shadow strategy used for the launch
          minLength: 1
        mainLaunchDt:
          type: string
          format: date-time
        shadowLaunchDt:
          type: string
          format: date-time
        attributes:
          type: object
          additionalProperties:
            type: string
      required:
      - mainLaunchDt
      - mainStrategyVersion
      - requestId
      - shadowLaunchDt
      - shadowStrategyVersion
    CompareStrategyResponse:
      type: object
      properties:
        strategyName:
          type: string
        contractVersion:
          type: string
        analyzedAt:
          type: string
          format: date-time
        metadata:
          $ref: "#/components/schemas/LaunchMetadata"
        summary:
          $ref: "#/components/schemas/ComparisonSummary"
        diffs:
          type: array
          items:
            $ref: "#/components/schemas/DiffEntry"
        contractValidation:
          type: array
          items:
            $ref: "#/components/schemas/ContractIssue"
      required:
      - analyzedAt
      - contractValidation
      - contractVersion
      - diffs
      - metadata
      - strategyName
      - summary
    ComparisonSummary:
      type: object
      properties:
        totalDiffs:
          type: integer
          format: int32
        metricDiffs:
          type: integer
          format: int32
        modelDiffs:
          type: integer
          format: int32
        calculationContextDiffs:
          type: integer
          format: int32
        contractTechnicalDiffs:
          type: integer
          format: int32
        contractValidationIssues:
          type: integer
          format: int32
        hasCriticalIssues:
          type: boolean
        deterministicSeverity:
          type: string
          enum:
          - INFO
          - WARNING
          - CRITICAL
      required:
      - calculationContextDiffs
      - contractTechnicalDiffs
      - contractValidationIssues
      - deterministicSeverity
      - hasCriticalIssues
      - metricDiffs
      - modelDiffs
      - totalDiffs
    ContractIssue:
      type: object
      properties:
        id:
          type: string
        side:
          type: string
          enum:
          - MAIN
          - SHADOW
        path:
          type: string
        type:
          type: string
          enum:
          - REQUIRED_FIELD_MISSING
          - TYPE_MISMATCH
          - NULLABILITY_VIOLATION
          - UNKNOWN_FIELD
        severity:
          type: string
          enum:
          - INFO
          - WARNING
          - CRITICAL
        expected:
          type: string
        actual:
          type: string
        actualValue:
          $ref: "#/components/schemas/JsonNode"
        message:
          type: string
      required:
      - actual
      - expected
      - id
      - message
      - path
      - severity
      - side
      - type
    DiffEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
        type:
          type: string
          enum:
          - NUMERIC_VALUE_CHANGED
          - STRING_VALUE_CHANGED
          - BOOLEAN_VALUE_CHANGED
          - FIELD_ADDED_IN_SHADOW
          - FIELD_MISSING_IN_SHADOW
          - FIELD_ADDED_IN_MAIN
          - TYPE_MISMATCH
          - NULLABILITY_VIOLATION
          - REQUIRED_FIELD_MISSING
        category:
          type: string
          enum:
          - METRIC
          - MODEL
          - CALCULATION_CONTEXT
          - CONTRACT_TECHNICAL
        mainValue:
          $ref: "#/components/schemas/JsonNode"
        shadowValue:
          $ref: "#/components/schemas/JsonNode"
        absoluteDelta:
          type: number
        relativeDeltaPercent:
          type: number
        comparisonBasis:
          type: string
          enum:
          - COERCED_NUMERIC
        deterministicSeverity:
          type: string
          enum:
          - WARNING
          - CRITICAL
      required:
      - category
      - deterministicSeverity
      - id
      - path
      - type
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
      required:
      - error
      - message
      - status
      - timestamp
