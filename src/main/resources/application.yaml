spring:
  application:
    name: strategy-launches-analyzer
  http:
    converters:
      preferred-json-mapper: jackson2
    codecs:
      preferred-json-mapper: jackson2
  lifecycle:
    timeout-per-shutdown-phase: 210s

strategy-launches-analyzer:
  batch:
    max-items: 1000
    max-line-bytes: 5242880
    max-request-bytes: 536870912
    parallelism: 4
    max-in-flight: 8
    max-concurrent-batches: 1
    hard-timeout: 3m
    temp-directory: ${java.io.tmpdir}/strategy-comparison-batches
    min-free-space-bytes: 1073741824
    xlsx-rows-per-sheet: 1000000
    xlsx-cell-preview-chars: 2000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
      show-details: never

server:
  shutdown: graceful

springdoc:
  api-docs:
    enabled: false
  paths-to-match: /api/v1/**
