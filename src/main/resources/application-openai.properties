strategy-launches-analyzer.agent.provider=openai

spring.ai.model.chat=openai
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-5.4}
# temperature намеренно не задаётся: GPT-5 reasoning-модели его не поддерживают (игнор/400).
# Детерминизм обеспечивает нативная JSON-схема structured output (см. SpringAiAgentAnalyzer).

# Реальный таймаут HTTP-клиента OpenAI берётся из connection-уровня (spring.ai.openai.timeout),
# который попадает в ResolvedConnectionProperties и далее в клиент. spring.ai.openai.chat.timeout
# на M8 в клиент не прокидывается, поэтому задаём оба, а полагаемся на connection-уровень.
spring.ai.openai.timeout=${OPENAI_TIMEOUT:20s}
spring.ai.openai.chat.timeout=${OPENAI_CHAT_TIMEOUT:20s}

# Консервативный ретрай под fail-hard: 2 попытки и короткий backoff
# (дефолты Spring AI — до 10 попыток с backoff до 3 минут, что при деградации OpenAI держит поток минутами).
spring.ai.retry.max-attempts=${OPENAI_RETRY_MAX_ATTEMPTS:2}
spring.ai.retry.backoff.initial-interval=500ms
spring.ai.retry.backoff.max-interval=2s

spring.ai.openai.chat.enabled=true
spring.ai.openai.embedding.enabled=false
spring.ai.openai.image.enabled=false
spring.ai.openai.audio.speech.enabled=false
spring.ai.openai.audio.transcription.enabled=false
spring.ai.openai.moderation.enabled=false
