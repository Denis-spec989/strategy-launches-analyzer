strategy-launches-analyzer.agent.provider=openai

spring.ai.model.chat=openai
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-5.5}
# temperature намеренно не задаётся: GPT-5 reasoning-модели его не поддерживают (игнор/400).
# Детерминизм обеспечивает нативная JSON-схема structured output (см. SpringAiAgentAnalyzer).

# Для reasoning-модели и strict structured output оставляем один предсказуемый вызов до 120s.
# В M8 chat-настройки имеют приоритет над общими, поэтому держим оба значения одинаковыми.
spring.ai.openai.timeout=${OPENAI_TIMEOUT:120s}
spring.ai.openai.chat.timeout=${OPENAI_CHAT_TIMEOUT:120s}

# У официального OpenAI Java SDK есть собственные ретраи поверх Spring AI. Отключаем оба
# уровня повторов, чтобы запрос не умножал 120s на несколько последовательных попыток.
spring.ai.openai.max-retries=${OPENAI_MAX_RETRIES:0}
spring.ai.openai.chat.max-retries=${OPENAI_CHAT_MAX_RETRIES:0}
spring.ai.retry.max-attempts=${OPENAI_RETRY_MAX_ATTEMPTS:1}
spring.ai.retry.backoff.initial-interval=500ms
spring.ai.retry.backoff.max-interval=2s

spring.ai.openai.chat.enabled=true
spring.ai.openai.embedding.enabled=false
spring.ai.openai.image.enabled=false
spring.ai.openai.audio.speech.enabled=false
spring.ai.openai.audio.transcription.enabled=false
spring.ai.openai.moderation.enabled=false
