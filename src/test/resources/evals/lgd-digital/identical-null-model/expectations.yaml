id: identical-null-model
tags: [identical, nullable, info]
semantic:
  requiredFacts:
    - Поле lgdModel имеет допустимое null-значение и в main, и в shadow
    - Между main и shadow обнаружено 0 детерминированных отличий
    - Количество отличий во всех категориях равно 0
    - Contract validation issues, включая нарушения nullability, отсутствуют
    - Итоговая severity должна быть INFO
    - По предоставленному payload нет изменений метрик, модели, расчетного контекста или контракта, влияющих на бизнес-интерпретацию результата
    - Контрактные, схемные, типовые и nullability-риски, а также технические изменения формы payload отсутствуют
  forbiddenConclusions:
    - Null в поле lgdModel нарушает контракт или означает отсутствие обязательного поля
    - Одинаковое null-значение модели должно создавать diff
    - В payload обнаружена регрессия или техническое нарушение
    - Отсутствие отличий в одном payload доказывает полную эквивалентность main и shadow во всех случаях
  expectedActions:
    - Зафиксировать результат сравнения как отсутствие детерминированных различий для данного payload
