id: model-null-transition
tags: [model, nullable, warning]
semantic:
  requiredFacts:
    - Обнаружено 1 детерминированное отличие категории MODEL с типом STRING_VALUE_CHANGED
    - Поле strategyResponse.lgdData.lgdModel изменилось с null в main на «Корпоративные клиенты 2023» в shadow
    - Поле lgdModel допускает null, поэтому null в main и переход к строковому значению не нарушают nullability-контракт
    - Contract validation issues и нарушения схемы, типа, обязательности или nullability отсутствуют
    - Итоговая severity должна быть WARNING, критические сигналы отсутствуют
    - Отличия метрик, расчетного контекста и технического контракта отсутствуют
    - Появление конкретной модели может изменить интерпретацию происхождения результата, но не доказывает изменение бизнес-показателей
  forbiddenConclusions:
    - Переход от null всегда является критической ошибкой контракта
    - Null в main означает отсутствие обязательного поля lgdModel
    - В payload обнаружено нарушение nullability или иная contract validation issue
    - Появление модели «Корпоративные клиенты 2023» доказанно изменило LGD-метрики
    - Значение модели в shadow можно считать ожидаемым без проверки конфигурации и согласования
  expectedActions:
    - Проверить ожидаемость использования модели «Корпоративные клиенты 2023» в shadow
    - Сверить конфигурацию выбора модели между main и shadow
    - Не связывать этот diff с изменением метрик без дополнительных данных о расчетах и входных условиях
    - Если изменение не ожидаемо, исправить конфигурацию или маппинг до продвижения
