id: metric-type-mismatch
tags: [critical, type-mismatch, metric]
semantic:
  requiredFacts:
    - Для strategyResponse.lgdData.lgd обнаружено 2 детерминированных отличия категории METRIC — TYPE_MISMATCH и NUMERIC_VALUE_CHANGED
    - Shadow передал обязательное поле lgd строкой "20.4" вместо ожидаемого number/double с кардинальностью 1..1
    - На стороне SHADOW обнаружена 1 CRITICAL contractValidation issue типа TYPE_MISMATCH
    - После однозначной числовой интерпретации LGD вырос с 18.1 до 20.4 — на 2.3 п.п. и 12.7072% относительно main
    - Числовой diff имеет comparisonBasis COERCED_NUMERIC и является только диагностическим сравнением
    - Строковое shadow-значение остается контрактно невалидным несмотря на возможность однозначной числовой интерпретации
    - Итоговая severity должна быть CRITICAL
    - Нарушение типа создает риск ошибок десериализации, отказов downstream-интеграций и некорректной типизации данных
    - Отдельные shape и nullability issues, а также отличия модели или расчетного контекста отсутствуют
  forbiddenConclusions:
    - Строковое значение является контрактно валидным числом
    - Диагностическое числовое сравнение автоматически исправило нарушение типа
    - Строку "20.4" можно безопасно передавать downstream-потребителям вместо number/double
    - Нарушение типа можно игнорировать, поскольку строка однозначно преобразуется в число
    - Диагностический рост LGD доказанно вызван ошибкой сериализации или маппинга
    - Shadow можно продвигать до исправления или явного согласования критического нарушения контракта
  expectedActions:
    - Заблокировать продвижение shadow до исправления CRITICAL TYPE_MISMATCH в поле lgd
    - Передавать strategyResponse.lgdData.lgd как обязательный number/double, а не строку
    - После исправления типа повторить детерминированное сравнение и отделить изменение LGD от ошибки сериализации или маппинга
    - Подтвердить с владельцами модели или метрики ожидаемость роста LGD с 18.1 до 20.4
    - Проверить downstream-потребителей lgd на риск отказов или некорректной обработки строки вместо числа
    - Задокументировать результат проверки бизнес-изменения LGD перед повторным рассмотрением запуска
