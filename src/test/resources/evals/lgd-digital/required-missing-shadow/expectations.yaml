id: required-missing-shadow
tags: [metric, critical, required-field, shadow]
semantic:
  requiredFacts:
    - Обнаружено 1 детерминированное отличие категории METRIC с типом FIELD_MISSING_IN_SHADOW
    - Поле strategyResponse.lgdData.lgd присутствует в main со значением 18.1 и полностью отсутствует в shadow
    - На стороне SHADOW обнаружена 1 CRITICAL contractValidation issue типа REQUIRED_FIELD_MISSING
    - Контракт требует поле lgd типа number/double с кардинальностью 1..1 и nullable=false
    - Итоговая severity должна быть CRITICAL из-за отсутствия обязательного поля
    - Отсутствующее поле отличается от поля, присутствующего со значением null
    - Без числового значения lgd невозможно определить направление или величину изменения LGD и использовать shadow для сопоставимых бизнес-решений
    - Нарушение создает риск ошибок обработки, парсинга и downstream-расчетов у потребителей, ожидающих обязательное поле
    - Отличия LGD downturn, модели, расчетного контекста и технических contract-полей отсутствуют
  forbiddenConclusions:
    - Отсутствующее поле можно игнорировать
    - Отсутствующее поле lgd эквивалентно null или числовому значению 0
    - LGD в shadow снизился с 18.1 до 0 или изменился на определенный процент
    - Наличие остальных полей lgdData компенсирует отсутствие обязательного lgd
    - Shadow можно продвигать как совместимый с действующим контрактом до восстановления поля
  expectedActions:
    - Заблокировать продвижение shadow до восстановления обязательного поля lgd
    - Проверить изменения стратегии, маппинга или сериализации, приведшие к отсутствию lgd
    - Обеспечить возврат lgd как непустого number/double с кардинальностью 1..1
