id: metric-scale-equivalent
tags: [metric, numeric-equivalence, info]
semantic:
  requiredFacts:
    - Между main и shadow обнаружено 0 детерминированных отличий
    - Количество отличий во всех категориях равно 0
    - Contract validation issues и критические сигналы отсутствуют
    - Итоговая severity должна быть INFO
    - По предоставленному payload нет признаков изменения бизнес-интерпретации результатов или решений стратегии
    - Нарушения контракта, схемы, типов и nullability, а также unknown fields и технические проблемы сериализации или маппинга не обнаружены
  forbiddenConclusions:
    - Формат 18.10 и 18.1 является изменением метрики
    - Обнаружена регрессия расчета
    - В payload присутствуют контрактные или технические нарушения
    - Отсутствие отличий в одном payload доказывает полную эквивалентность main и shadow во всех случаях
  expectedActions:
    - Зафиксировать результат сравнения как отсутствие детерминированных различий для данного payload
