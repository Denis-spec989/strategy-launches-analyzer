id: multi-diff-critical
tags: [multi-diff, metric, model, calculation-context, critical, contract]
semantic:
  requiredFacts:
    - Обнаружено 9 детерминированных отличий — 3 категории METRIC, 1 категории MODEL, 3 категории CALCULATION_CONTEXT и 2 категории CONTRACT_TECHNICAL
    - В обязательном поле lgd shadow передал строку "24.7" вместо number, поэтому обнаружены TYPE_MISMATCH и 1 CRITICAL contractValidation issue на стороне SHADOW
    - Диагностический COERCED_NUMERIC diff показывает рост lgd с 18.1 до 24.7 — на 6.6 п.п. и 36.4641%, но не исправляет нарушение типа
    - LGD downturn вырос с 18.1 до 26.2 — на 8.1 п.п. и 44.7514%
    - Модель расчета изменилась с «Корпоративные клиенты 2022» на «Корпоративные клиенты 2024»
    - Поле mode изменилось с DEAL на PORTFOLIO, а type — с ONLINE на BATCH; оба изменения являются hard-critical contract-level сигналами
    - Сценарий изменился с LGD_CALCULATION_FOR_FZHN на LGD_CALCULATION_DEFAULT
    - Признак usedDefaultValue изменился с true на false, а defaultValueReason — с LGD_CALCULATION_FOR_FZHN на MANUAL_OVERRIDE
    - Итоговая severity должна быть CRITICAL из-за нарушения типа и изменений mode и type
    - Рост метрик, смена модели и другой расчетный контекст существенно меняют бизнес-интерпретацию shadow-результата
    - Технические риски включают ошибку сериализации или маппинга lgd, смену режима и типа расчета и несопоставимость расчетных контекстов
  forbiddenConclusions:
    - Обычная проверка без блокировки достаточна
    - Диагностическое COERCED_NUMERIC сравнение делает строковое значение lgd контрактно валидным
    - Смена модели доказанно стала причиной роста LGD-метрик
    - Смена сценария или default-механизма доказанно стала причиной роста LGD-метрик
    - Изменения mode и type являются отдельными contractValidation issues в данном payload
    - Shadow можно продвигать до исправления или явного согласования критических нарушений
  expectedActions:
    - Заблокировать продвижение shadow до устранения критического нарушения типа поля lgd
    - Исправить сериализацию или маппинг lgd, чтобы значение 24.7 передавалось как number
    - Отдельно проверить ожидаемость перехода mode с DEAL на PORTFOLIO
    - Отдельно проверить ожидаемость перехода type с ONLINE на BATCH
    - Подтвердить, что смена модели на «Корпоративные клиенты 2024» была запланирована
    - Валидировать рост lgd на 6.6 п.п. и lgdDt на 8.1 п.п.
    - Проверить корректность сценария LGD_CALCULATION_DEFAULT в shadow
    - Проверить согласованность usedDefaultValue=false и defaultValueReason=MANUAL_OVERRIDE
