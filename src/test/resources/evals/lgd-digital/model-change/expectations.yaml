id: model-change
tags: [model, metric, warning]
semantic:
  requiredFacts:
    - Обнаружено 3 детерминированных отличия — 2 категории METRIC и 1 категории MODEL
    - В shadow модель расчета изменилась с «Корпоративные клиенты 2022» на «Корпоративные клиенты 2023»
    - LGD и LGD downturn в shadow выросли с 18.1 до 20.4
    - Для обеих метрик absoluteDelta равна 2.3, а relativeDeltaPercent равна 12.7072
    - Итоговая severity должна быть WARNING, критические сигналы отсутствуют
    - Рост обеих LGD-метрик может изменить оценку ожидаемых потерь и стрессового риск-профиля
    - Смена модели важна для интерпретации метрик, но сама по себе не доказывает причину их изменения
    - Contract validation issues и нарушения схемы, типов, обязательности или nullability отсутствуют
    - Технические риски связаны с трассируемостью версии модели, конфигурацией shadow и ожидаемостью значений, а не с контрактом
  forbiddenConclusions:
    - Смена модели доказанно стала причиной изменения метрик
    - Рост LGD доказанно вызван только переходом на модель «Корпоративные клиенты 2023»
    - В payload обнаружены критические или контрактные нарушения
    - Отсутствие контрактных ошибок позволяет автоматически продвигать shadow без проверки модели и метрик
  expectedActions:
    - Проверить ожидаемость перехода на модель «Корпоративные клиенты 2023»
    - Отдельно выполнить бизнес-валидацию роста LGD и LGD downturn с 18.1 до 20.4
    - Сверить конфигурацию, версию модели и входные параметры main и shadow
    - Получить подтверждение владельца модели или риск-методологии перед продвижением shadow
