id: mode-critical
tags: [critical, contract, mode]
semantic:
  requiredFacts:
    - Обнаружено 1 детерминированное отличие категории CONTRACT_TECHNICAL с типом STRING_VALUE_CHANGED
    - Значение strategyResponse.calculationInfo.mode в shadow изменилось с "DEAL" на "DEA"
    - Поле mode является обязательным строковым полем с кардинальностью 1..1, не допускает null и описывает режим расчета
    - Изменение mode является hard-critical сигналом, поэтому итоговая severity должна быть CRITICAL
    - Contract validation issues и явные нарушения схемы, типа или nullability отсутствуют
    - Отличия метрик, модели и прочего расчетного контекста отсутствуют
    - Смена mode может изменить бизнес-интерпретацию результата и обработку потребителями, использующими режим для маршрутизации или контроля
    - Технический риск связан с возможной регрессией константы, сериализации, маппинга или режима интеграции
  forbiddenConclusions:
    - Shadow можно продвигать без проверки режима
    - Наличие hard-critical diff означает, что contractValidation обнаружила отдельное нарушение
    - Значение "DEA" доказанно является согласованным новым режимом
    - Значение "DEA" доказанно возникло из-за ошибки маппинга, константы или сериализации
    - Изменение mode повлекло изменение LGD-метрик в данном payload
  expectedActions:
    - Заблокировать продвижение shadow до выяснения причины изменения mode
    - Проверить, является ли "DEA" ожидаемым новым значением или результатом регрессии константы, сериализации либо маппинга
    - Сравнить формирование поля mode в main и shadow для LGD_DIGITAL
    - Если "DEA" не является согласованным значением, исправить shadow и повторить детерминированное сравнение
    - Если изменение намеренное, согласовать изменение контракта с владельцами downstream-систем до запуска
