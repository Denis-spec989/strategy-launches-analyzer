id: calculation-context-change
tags: [calculation-context, warning]
semantic:
  requiredFacts:
    - Обнаружено 3 детерминированных отличия категории CALCULATION_CONTEXT; отличия категорий METRIC, MODEL и CONTRACT_TECHNICAL отсутствуют
    - Значения LGD и LGD downturn не изменились и равны 18.1 в main и shadow
    - Сценарий расчета изменился с LGD_CALCULATION_FOR_FZHN на LGD_CALCULATION_DEFAULT
    - Признак usedDefaultValue изменился с true на false
    - Причина defaultValueReason изменилась с LGD_CALCULATION_FOR_FZHN на MANUAL_OVERRIDE
    - Contract validation issues и признаки нарушения схемы, типов или nullability отсутствуют
    - Итоговая severity должна быть WARNING, поскольку hard-critical diff и CRITICAL contract issues отсутствуют
    - Shadow описывает другой сценарий и ручное переопределение вместо автоматического присвоения, поэтому происхождение и интерпретация результата требуют проверки, хотя числовые метрики не изменились
  forbiddenConclusions:
    - Смена сценария или ручное переопределение доказанно изменили LGD-метрики
    - В payload обнаружены нарушения контракта, схемы, типов или nullability
    - Изменение расчетного контекста не влияет на интерпретацию и сопоставимость результатов
    - Изменения расчетного контекста имеют severity CRITICAL или сами по себе требуют автоматической блокировки promotion
    - Неизменность LGD-метрик доказывает, что новый расчетный контекст корректен и не требует проверки
  expectedActions:
    - Проверить ожидаемость перехода с LGD_CALCULATION_FOR_FZHN на LGD_CALCULATION_DEFAULT
    - Подтвердить, что usedDefaultValue=false согласуется с defaultValueReason=MANUAL_OVERRIDE и фактическим способом формирования результата
    - Проверить с владельцами бизнес-логики, допустимо ли получать те же LGD=18.1 и LGD downturn=18.1 при новом расчетном сценарии
    - Зафиксировать подтверждение ожидаемости изменений расчетного контекста перед продвижением shadow
