id: unknown-object-array
tags: [contract-technical, unknown-field, object, array, warning]
semantic:
  requiredFacts:
    - Обнаружено 1 детерминированное отличие категории CONTRACT_TECHNICAL с типом FIELD_ADDED_IN_SHADOW
    - Поле strategyResponse.calculationInfo.debugInfo присутствует только в shadow и содержит объект с trace и массивом steps
    - На стороне SHADOW обнаружена 1 contractValidation issue типа UNKNOWN_FIELD с severity WARNING и actual object
    - Поле debugInfo не объявлено в контракте LGD_DIGITAL и для него отсутствуют contractContext и подтвержденный бизнес-смысл
    - Вложенные trace и steps являются содержимым одного неизвестного поля, а не отдельными детерминированными diff-ами
    - Итоговая severity должна быть WARNING, критические сигналы отсутствуют
    - Отличия метрик, модели и расчетного контекста отсутствуют
    - Неизвестный объект создает риск несовместимости со строгими схемами и отказа downstream-потребителей
    - Нарушения типа, nullability, обязательности или формы объявленных контрактных полей отсутствуют
  forbiddenConclusions:
    - Содержимое debugInfo доказывает причину изменения стратегии
    - Значения trace и steps имеют подтвержденный бизнес-смысл или описывают фактическую причину расчета
    - Для вложенных полей debugInfo обнаружены отдельные diff-ы или contract validation issues
    - Поле debugInfo является частью действующего контракта LGD_DIGITAL
    - UNKNOWN_FIELD уровня WARNING является критическим нарушением типа, nullability или формы объявленных полей
    - Изменение относится к бизнес-метрикам, модели или расчетному контексту
  expectedActions:
    - Проверить, является ли debugInfo намеренно добавленным диагностическим полем в shadow
    - Если debugInfo требуется в публичном ответе, добавить его в контракт и согласовать с потребителями
    - Если debugInfo является внутренней отладочной информацией, удалить его из контрактного ответа shadow
    - Проверить downstream-потребителей на зависимость от строгой схемы и обработку неизвестных объектов
