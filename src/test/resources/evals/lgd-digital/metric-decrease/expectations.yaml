id: metric-decrease
tags: [metric, warning]
semantic:
  requiredFacts:
    - Обнаружено 2 детерминированных отличия категории METRIC с типом NUMERIC_VALUE_CHANGED
    - LGD и LGD downturn в shadow снизились с 20.4 до 18.1
    - Для обеих метрик absoluteDelta равна -2.3, а relativeDeltaPercent равна -11.2745
    - Итоговая severity должна быть WARNING, критические сигналы отсутствуют
    - Снижение обеих LGD-метрик делает shadow менее консервативным и может изменить оценку потерь при дефолте и в стрессовом сценарии
    - Отличия модели, расчетного контекста и технического контракта отсутствуют
    - Contract validation issues и нарушения схемы, типов, nullability или формы payload отсутствуют
    - Downstream-потребители при неизменной структуре ответа могут получить более низкие значения LGD
  forbiddenConclusions:
    - Снижение гарантированно улучшает кредитные решения
    - Снижение LGD доказанно вызвано изменением модели, формулы или параметров
    - В payload обнаружены критические или контрактные нарушения
    - Отрицательная дельта сама по себе позволяет продвигать shadow без бизнес-проверки
  expectedActions:
    - Проверить ожидаемость снижения LGD и LGD downturn в shadow относительно main
    - Сверить снижение с утвержденными изменениями модели, формул или параметров LGD_DIGITAL, если такие изменения планировались
    - Получить подтверждение, что снижение на 2.3 п.п. и примерно 11.27% соответствует бизнес-ожиданиям
    - Уточнить чувствительность downstream-потребителей к более низким значениям LGD
