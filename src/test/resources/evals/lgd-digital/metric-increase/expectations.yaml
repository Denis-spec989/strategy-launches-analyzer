id: metric-increase
tags: [metric, warning]
semantic:
  requiredFacts:
    - Обнаружено 2 детерминированных отличия категории METRIC с типом NUMERIC_VALUE_CHANGED
    - LGD и LGD downturn в shadow выросли с 18.1 до 20.4
    - Для обеих метрик absoluteDelta равна 2.3, а relativeDeltaPercent равна 12.7072
    - Итоговая severity должна быть WARNING, критические сигналы отсутствуют
    - Рост обеих LGD-метрик может повысить оценку ожидаемых потерь и изменить интерпретацию риск-профиля, включая downturn-сценарий
    - Отличия модели, расчетного контекста и технического контракта отсутствуют
    - Contract validation issues и нарушения схемы, типов, nullability или формы payload отсутствуют
    - Downstream-потребители при неизменной структуре ответа могут получить более высокие значения LGD
  forbiddenConclusions:
    - Рост LGD доказанно вызван изменением модели, формулы или параметров
    - Повышение LGD доказывает изменение всех зависимых бизнес-решений
    - В payload обнаружены критические или контрактные нарушения
    - Положительная дельта сама по себе позволяет продвигать shadow без бизнес-проверки
  expectedActions:
    - Проверить ожидаемость роста LGD и LGD downturn в shadow относительно main
    - Сопоставить рост с утвержденными изменениями модели, параметров или расчетной логики LGD_DIGITAL
    - Получить подтверждение владельца стратегии или риск-методологии, что рост на 2.3 п.п. соответствует бизнес-ожиданиям
    - Уточнить чувствительность downstream-потребителей к более высоким значениям LGD
