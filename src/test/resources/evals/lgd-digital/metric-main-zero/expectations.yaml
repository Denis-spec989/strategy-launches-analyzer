id: metric-main-zero
tags: [metric, zero-baseline, warning]
semantic:
  requiredFacts:
    - Обнаружено 2 детерминированных отличия категории METRIC с типом NUMERIC_VALUE_CHANGED
    - LGD и LGD downturn в shadow выросли с 0 до 5
    - Для обеих метрик absoluteDelta равна 5
    - RelativeDeltaPercent не рассчитывается и отсутствует при нулевом main
    - Итоговая severity должна быть WARNING, критические сигналы отсутствуют
    - Shadow показывает ненулевые потери там, где main возвращал 0, что может изменить бизнес-интерпретацию ожидаемых потерь
    - Отличия модели, расчетного контекста и технического контракта отсутствуют
    - Contract validation issues и нарушения схемы, типов, nullability или формы payload отсутствуют
    - Технический риск связан с корректностью расчета и маппинга числовых метрик, а не с совместимостью контракта
  forbiddenConclusions:
    - Относительный рост равен бесконечности
    - Относительный рост равен 500% или другому вычисленному проценту
    - Нулевое значение main само по себе нарушает контракт
    - В payload обнаружены критические или контрактные нарушения
    - Переход от 0 к 5 можно принять без бизнес-проверки
  expectedActions:
    - Проверить ожидаемость роста LGD с 0 до 5
    - Проверить ожидаемость роста LGD downturn с 0 до 5 для сценария экономического спада
    - Получить подтверждение владельца стратегии или риск-методологии, что рост на 5 п.п. соответствует бизнес-ожиданиям
    - Уточнить чувствительность downstream-потребителей к более высоким значениям LGD
