id: unknown-scalar
tags: [contract-technical, unknown-field, scalar, warning]
semantic:
  requiredFacts:
    - Обнаружено 1 детерминированное отличие категории CONTRACT_TECHNICAL с типом FIELD_ADDED_IN_SHADOW
    - Поле strategyResponse.calculationInfo.usingCollateral присутствует только в shadow и имеет строковое значение "4"
    - На стороне SHADOW обнаружена 1 contractValidation issue типа UNKNOWN_FIELD с severity WARNING и actual string
    - Поле usingCollateral не объявлено в контракте LGD_DIGITAL и для него отсутствуют contractContext и подтвержденный бизнес-смысл
    - Итоговая severity должна быть WARNING, критические сигналы отсутствуют
    - Отличия метрик, модели и расчетного контекста отсутствуют
    - Неизвестное поле создает риск несовместимости со строгими схемами, расхождения сериализации или маппинга и неуправляемого расширения payload
  forbiddenConclusions:
    - usingCollateral имеет известный бизнес-смысл из контракта
    - Строковое значение "4" можно автоматически интерпретировать как число, код, количество или признак использования залога
    - Поле usingCollateral является частью действующего контракта LGD_DIGITAL
    - UNKNOWN_FIELD уровня WARNING является критическим нарушением типа, nullability или обязательности объявленного поля
    - Значение usingCollateral можно использовать для бизнес-выводов или решений до согласования его семантики
    - Изменение относится к бизнес-метрикам, модели или расчетному контексту
  expectedActions:
    - Проверить, является ли usingCollateral ожидаемым новым полем или ошибкой сериализации либо маппинга shadow
    - Если поле требуется, согласовать его бизнес-семантику, тип и допустимые значения и добавить в контракт LGD_DIGITAL
    - Если поле не требуется, удалить его из shadow до продвижения
    - Проверить downstream-потребителей на чувствительность к неизвестным полям и строгую валидацию схемы
    - Не использовать значение "4" для бизнес-выводов до формализации поля в контракте
