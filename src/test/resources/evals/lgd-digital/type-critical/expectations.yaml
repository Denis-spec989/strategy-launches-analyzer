id: type-critical
tags: [critical, contract, type]
semantic:
  requiredFacts:
    - Обнаружено 1 детерминированное отличие категории CONTRACT_TECHNICAL с типом STRING_VALUE_CHANGED
    - Значение strategyResponse.calculationInfo.type в shadow изменилось с ONLINE на BATCH
    - Поле type является обязательным ненулевым строковым полем с кардинальностью 1..1 и описывает тип расчета
    - Переход ONLINE на BATCH означает смену онлайн-расчета на пакетный расчет и может изменить операционный или интеграционный контур
    - Изменение type является hard-critical сигналом, поэтому итоговая severity должна быть CRITICAL
    - Contract validation issues и явные нарушения схемы, типа или nullability отсутствуют
    - Отличия метрик, модели и остального расчетного контекста отсутствуют
    - Технический риск связан с возможной регрессией интеграционного режима, конфигурации, сериализации или маппинга
    - Downstream-потребители могут зависеть от ONLINE для маршрутизации и обработки ответа
  forbiddenConclusions:
    - Интеграционный режим остался прежним
    - Наличие hard-critical diff означает, что contractValidation обнаружила отдельное нарушение
    - Значение BATCH доказанно является ошибочным или запрещенным контрактом
    - Переход на BATCH доказанно вызван регрессией конфигурации, сериализации или маппинга
    - Изменение type повлекло изменение LGD-метрик в данном payload
    - Shadow можно продвигать без подтверждения нового интеграционного режима
  expectedActions:
    - Заблокировать продвижение shadow до подтверждения ожидаемости перехода ONLINE на BATCH
    - Проверить конфигурацию, сериализацию и маппинг LGD_DIGITAL, влияющие на поле type
    - Согласовать с владельцами интеграции допустимость BATCH для данного сценария
    - Проверить downstream-потребителей type на зависимость от ONLINE и риск некорректной маршрутизации
    - После исправления или подтверждения изменения повторить детерминированное сравнение main и shadow
