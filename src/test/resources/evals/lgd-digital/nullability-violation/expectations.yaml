id: nullability-violation
tags: [critical, nullability, metric]
semantic:
  requiredFacts:
    - Обнаружено 1 детерминированное отличие категории METRIC с типом NULLABILITY_VIOLATION
    - Поле strategyResponse.lgdData.lgd изменилось с 18.1 в main на null в shadow
    - На стороне SHADOW обнаружена 1 CRITICAL contractValidation issue типа NULLABILITY_VIOLATION
    - Поле lgd должно быть обязательным number с кардинальностью 1..1 и не допускает null, поэтому null нарушает действующий контракт; числовое значение 0 допустимо
    - Итоговая severity должна быть CRITICAL и promotion должен быть заблокирован до устранения нарушения
    - Null нельзя интерпретировать как рост, снижение или нулевое значение LGD
    - Без значения lgd shadow нельзя корректно использовать для сравнения потерь при дефолте или зависящих от LGD решений
    - Нарушение создает риск несовместимости схемы, ошибок интеграций, сериализации, маппинга и последующих расчетов
    - Отличия модели, LGD downturn, расчетного контекста и технических contract-полей отсутствуют
  forbiddenConclusions:
    - Null является допустимым для LGD
    - Null эквивалентен числовому значению 0
    - LGD в shadow снизился с 18.1 до 0 или изменился на определенный процент
    - Наличие поля со значением null удовлетворяет обязательному non-null контракту
    - Shadow можно продвигать как совместимый с действующим контрактом без исправления или его согласованного изменения
  expectedActions:
    - Заблокировать продвижение shadow до устранения CRITICAL nullability violation в поле lgd
    - Найти причину, по которой обязательное числовое поле lgd стало возвращаться как null
    - Восстановить lgd как непустое число с кардинальностью 1..1
    - Если отсутствие LGD намеренно, отдельно согласовать изменение контракта и влияние на потребителей до продвижения
